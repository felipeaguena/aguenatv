name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - '.github/workflows/build-android.yml'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22 (LTS exigido pelo Capacitor 8)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          JWT_SECRET: temporary-build-secret-key-32chars-for-ci-cd!

      - name: Configurar Java 21 (JDK exigido pelo Capacitor 8)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Aceitar Licenças e Instalar Plataforma Android 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Sincronizar Capacitor com Android
        run: npx cap sync android
        env:
          CAPACITOR_SERVER_URL: ${{ secrets.CAPACITOR_SERVER_URL }}

      - name: Dar permissão de execução ao Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Configurar Keystore Release Oficial
        run: |
          if [ ! -f android/aguenatv-release.jks ]; then
            keytool -genkeypair -v -keystore android/aguenatv-release.jks -alias aguenatv -keyalg RSA -keysize 2048 -validity 10000 -storepass aguenatv2026 -keypass aguenatv2026 -dname "CN=AGUENATV, OU=App, O=Aguena, L=Sao Paulo, ST=SP, C=BR"
          fi

      - name: Compilar APK Mobile (com.aguenatv.app)
        run: |
          cd android
          ./gradlew clean assembleRelease assembleDebug -PtargetVariant=mobile --no-daemon --stacktrace
          cd ..
          mkdir -p build-apks
          VERSION=$(node -p "require('./package.json').version")
          VERSION_SLUG=$(echo "$VERSION" | tr '.' '-')
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk build-apks/AGUENATV-release-${VERSION_SLUG}-mobile.apk
            cp android/app/build/outputs/apk/release/app-release.apk build-apks/AGUENATV-release.apk
          elif [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk build-apks/AGUENATV-release-${VERSION_SLUG}-mobile.apk
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk build-apks/AGUENATV-release.apk
          fi
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk build-apks/AGUENATV-debug-${VERSION_SLUG}-mobile.apk
            cp android/app/build/outputs/apk/debug/app-debug.apk build-apks/AGUENATV-debug.apk
          fi

      - name: Compilar APK TV & Tablet (com.aguenatv.tv)
        run: |
          cd android
          ./gradlew clean assembleRelease assembleDebug -PtargetVariant=tv --no-daemon --stacktrace
          cd ..
          VERSION=$(node -p "require('./package.json').version")
          VERSION_SLUG=$(echo "$VERSION" | tr '.' '-')
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk build-apks/AGUENATV-release-${VERSION_SLUG}-tv-tablet.apk
          elif [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk build-apks/AGUENATV-release-${VERSION_SLUG}-tv-tablet.apk
          fi
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk build-apks/AGUENATV-debug-${VERSION_SLUG}-tv-tablet.apk
          fi

      - name: Publicar APKs como Artefato de Download
        uses: actions/upload-artifact@v4
        with:
          name: aguenatv-apks
          path: build-apks/*.apk
          retention-days: 30

      - name: Obter Versão do package.json
        id: pkg_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          VERSION_SLUG=$(echo "$VERSION" | tr '.' '-')
          echo "version=v$VERSION" >> $GITHUB_OUTPUT
          echo "version_slug=$VERSION_SLUG" >> $GITHUB_OUTPUT

      - name: Publicar Release no GitHub
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ steps.pkg_version.outputs.version }}
          name: AGUENATV ${{ steps.pkg_version.outputs.version }}
          body: |
            ## 🚀 AGUENATV ${{ steps.pkg_version.outputs.version }}

            ### 📦 Aplicativos Disponíveis para Download:
            - 📱 **`AGUENATV-release-${{ steps.pkg_version.outputs.version_slug }}-mobile.apk`** *(Recomendado para Celulares)*: Aplicativo 100% otimizado para celulares Android com barra de navegação inferior (dock), gestos de toque, rotação automática e download offline.
            - 📺 **`AGUENATV-release-${{ steps.pkg_version.outputs.version_slug }}-tv-tablet.apk`** *(Recomendado para Smart TV & Tablet)*: Aplicativo dedicado para Smart TVs, TV Box, Fire TV Stick e Tablets, com navegação por controle remoto (D-Pad), foco neon violeta, proporção 16:9 widescreen e banner oficial na tela inicial.
            - 🛠️ **`AGUENATV-debug-*.apk`**: Versões de depuração para desenvolvedores.
          files: |
            build-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
