name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - '.github/workflows/build-android.yml'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22 (LTS exigido pelo Capacitor 8)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          JWT_SECRET: temporary-build-secret-key-32chars-for-ci-cd!

      - name: Configurar Java 21 (JDK exigido pelo Capacitor 8)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Aceitar Licenças e Instalar Plataforma Android 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Sincronizar Capacitor com Android
        run: npx cap sync android
        env:
          CAPACITOR_SERVER_URL: ${{ secrets.CAPACITOR_SERVER_URL }}

      - name: Dar permissão de execução ao Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Compilar APK Debug
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publicar APK como Artefato de Download
        uses: actions/upload-artifact@v4
        with:
          name: aguenatv-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
