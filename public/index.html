<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>AGUENATV</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #0b0c10;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      text-align: center;
      padding: 24px;
    }
    .logo-container {
      position: relative;
      margin-bottom: 24px;
    }
    .glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 140px;
      height: 140px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.4) 0%, rgba(139, 92, 246, 0) 70%);
      border-radius: 50%;
      filter: blur(20px);
    }
    .logo {
      position: relative;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 0%, #c4b5fd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(139, 92, 246, 0.2);
      border-top-color: #8b5cf6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status {
      font-size: 14px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <div class="glow"></div>
    <div class="logo">AGUENATV</div>
  </div>
  <div class="spinner"></div>
  <div class="status" id="status-text">Conectando ao AGUENATV...</div>

  <script>
    // Se o app estiver configurado com um servidor remoto, tenta redirecionar
    const storedServer = localStorage.getItem('aguenatv_server_url');
    if (storedServer) {
      window.location.replace(storedServer);
    } else {
      // Tenta localhost / endereço padrão
      setTimeout(() => {
        window.location.replace('/');
      }, 500);
    }
  </script>
</body>
</html>
