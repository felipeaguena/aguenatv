<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>AGUENATV - Modo Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: #0b0c10;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 0;
      padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
      position: relative;
      overflow-x: hidden;
      overscroll-behavior-y: contain;
    }

    /* Ambient Glow Background */
    .glow-1 {
      position: fixed;
      top: -150px;
      left: -150px;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, rgba(139, 92, 246, 0) 70%);
      border-radius: 50%;
      filter: blur(50px);
      pointer-events: none;
      z-index: 0;
    }
    .glow-2 {
      position: fixed;
      bottom: -150px;
      right: -150px;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.12) 0%, rgba(99, 102, 241, 0) 70%);
      border-radius: 50%;
      filter: blur(50px);
      pointer-events: none;
      z-index: 0;
    }

    /* Navbar Superior */
    header {
      position: sticky;
      top: 0;
      z-index: 40;
      width: 100%;
      background: rgba(12, 13, 18, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: max(14px, env(safe-area-inset-top, 0px));
      padding-bottom: 12px;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      cursor: pointer;
    }
    .brand-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.35);
    }
    .brand-icon svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .brand-text {
      font-size: 19px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: #ffffff;
    }
    .brand-text span {
      color: #8b5cf6;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-offline {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    .btn-reconnect {
      background: rgba(139, 92, 246, 0.2);
      border: 1px solid rgba(139, 92, 246, 0.4);
      color: #c4b5fd;
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }
    .btn-reconnect:active {
      transform: scale(0.96);
      background: rgba(139, 92, 246, 0.35);
    }

    /* Container Principal */
    main {
      flex: 1;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      padding: 16px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Notificação Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(19, 20, 27, 0.95);
      border: 1px solid rgba(139, 92, 246, 0.4);
      color: #fff;
      padding: 10px 18px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      z-index: 200;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: opacity 0.3s, transform 0.3s;
    }

    /* Abas de Navegação */
    .tabs-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #13141b;
      padding: 6px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      overflow-x: auto;
    }
    .tab-btn {
      flex: 1;
      padding: 10px 14px;
      border-radius: 12px;
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .tab-btn.active {
      background: #8b5cf6;
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.35);
    }
    .tab-count {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.3);
      color: inherit;
    }

    /* Barra de Informações de Armazenamento e Busca */
    .info-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .storage-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 12px;
      background: #13141b;
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 12px;
      color: #cbd5e1;
    }
    .storage-badge strong {
      color: #a78bfa;
    }

    .search-box {
      flex: 1;
      min-width: 220px;
      position: relative;
    }
    .search-box input {
      width: 100%;
      background: #13141b;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 9px 14px 9px 36px;
      font-size: 12px;
      color: #fff;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }
    .search-box input:focus {
      border-color: #8b5cf6;
    }
    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      fill: none;
      stroke: #64748b;
      stroke-width: 2;
    }

    /* Cards de Títulos */
    .downloads-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .group-card {
      background: #13141b;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .group-card:hover {
      border-color: rgba(139, 92, 246, 0.35);
    }

    .group-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .group-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }
    .group-thumb {
      width: 58px;
      height: 78px;
      border-radius: 12px;
      background: #000;
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .group-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .group-badge-line {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge-type {
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(139, 92, 246, 0.2);
      color: #c4b5fd;
      border: 1px solid rgba(139, 92, 246, 0.3);
    }
    .badge-size {
      font-size: 10px;
      font-family: monospace;
      color: #94a3b8;
    }
    .group-title {
      font-size: 14px;
      font-weight: 800;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .group-desc {
      font-size: 11px;
      color: #94a3b8;
    }

    .group-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-action-primary {
      padding: 8px 14px;
      border-radius: 10px;
      background: #8b5cf6;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
      transition: all 0.2s;
    }
    .btn-action-primary:active {
      transform: scale(0.96);
    }

    .btn-action-secondary {
      padding: 8px 12px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-action-secondary:active {
      transform: scale(0.96);
      background: rgba(255, 255, 255, 0.1);
    }

    .btn-action-danger {
      padding: 8px;
      border-radius: 10px;
      background: rgba(244, 63, 94, 0.1);
      border: 1px solid rgba(244, 63, 94, 0.25);
      color: #fda4af;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .btn-action-danger:active {
      transform: scale(0.96);
      background: rgba(244, 63, 94, 0.2);
    }

    /* Lista Expansível de Episódios */
    .episodes-list {
      margin-top: 6px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 8px;
    }
    .episode-card {
      background: #0b0c10;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .episode-info {
      flex: 1;
      min-width: 0;
    }
    .episode-title {
      font-size: 12px;
      font-weight: 700;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .episode-meta {
      font-size: 10px;
      font-family: monospace;
      color: #64748b;
      margin-top: 2px;
    }
    .episode-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    /* Estado Vazio */
    .empty-state {
      padding: 48px 16px;
      text-align: center;
      background: rgba(19, 20, 27, 0.5);
      border: 1px dashed rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .empty-icon {
      width: 56px;
      height: 56px;
      border-radius: 18px;
      background: rgba(139, 92, 246, 0.1);
      border: 1px solid rgba(139, 92, 246, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #a78bfa;
      font-size: 24px;
    }

    /* Player de Vídeo em Tela Cheia */
    .player-modal {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 1000;
      display: flex;
      flex-direction: column;
    }
    .player-topbar {
      padding: 14px 18px;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0) 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
    }
    .player-name {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .btn-close-player {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 6px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }
    video {
      width: 100%;
      height: 100%;
      background: #000;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <!-- Header -->
  <header>
    <div class="brand" id="brand-header">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24">
          <rect width="20" height="15" x="2" y="7" rx="2" />
          <polyline points="17 2 12 7 7 2" />
        </svg>
      </div>
      <div class="brand-text">AGUENA<span>TV</span></div>
    </div>

    <div class="header-actions">
      <div class="badge-offline">
        <span class="badge-dot"></span>
        <span>Modo Offline</span>
      </div>

      <button type="button" class="btn-reconnect" id="btn-reconnect" title="Tentar reconectar com o servidor remoto">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
        </svg>
        <span>Reconectar</span>
      </button>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main>
    <!-- Abas -->
    <div class="tabs-bar">
      <button type="button" class="tab-btn active" id="tab-downloads-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>
        </svg>
        <span>Vídeos Baixados</span>
        <span class="tab-count" id="downloads-badge-count">0</span>
      </button>

      <button type="button" class="tab-btn" id="tab-catalog-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <rect width="18" height="18" x="3" y="3" rx="2"/>
          <path d="M3 9h18M9 21V9"/>
        </svg>
        <span>Catálogo em Cache</span>
        <span class="tab-count" id="catalog-badge-count">0</span>
      </button>
    </div>

    <!-- Barra de Informações de Armazenamento e Busca -->
    <div class="info-bar">
      <div class="storage-badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="2">
          <line x1="22" x2="2" y1="12" y2="12"/>
          <path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>
          <line x1="6" x2="6.01" y1="16" y2="16"/>
          <line x1="10" x2="10.01" y1="16" y2="16"/>
        </svg>
        <span>Espaço em disco: <strong id="total-storage-text">0 MB</strong></span>
      </div>

      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" x2="16.65" y1="21" y2="16.65"/>
        </svg>
        <input type="text" id="search-input" placeholder="Filtrar títulos..." />
      </div>
    </div>

    <!-- Seção 1: Vídeos Baixados Offline -->
    <div id="section-downloads" class="downloads-grid">
      <!-- Renderizado via JS -->
    </div>

    <!-- Seção 2: Catálogo em Cache -->
    <div id="section-catalog" class="downloads-grid hidden">
      <!-- Renderizado via JS -->
    </div>
  </main>

  <!-- Toast de Notificação -->
  <div id="toast" class="toast hidden"></div>

  <!-- Player Modal Fullscreen -->
  <div id="player-modal" class="player-modal hidden">
    <div class="player-topbar">
      <div class="player-name" id="player-video-title">Reproduzindo</div>
      <button type="button" class="btn-close-player" id="btn-close-player">✕ Fechar</button>
    </div>
    <video id="player-element" controls playsinline autoplay></video>
  </div>

  <script>
    (function () {
      const SERVER_URL = 'http://163.176.207.140';
      const DB_NAME = 'IPTV_Miruro_LocalDB';
      const ALT_DB_NAME = 'AGUENATV_LOCAL_DB';

      let allDownloads = [];
      let allStreams = [];
      let currentTab = 'downloads';
      let searchQuery = '';
      let expandedKeys = new Set();

      const secDownloads = document.getElementById('section-downloads');
      const secCatalog = document.getElementById('section-catalog');
      const tabDownloadsBtn = document.getElementById('tab-downloads-btn');
      const tabCatalogBtn = document.getElementById('tab-catalog-btn');
      const downloadsBadgeCount = document.getElementById('downloads-badge-count');
      const catalogBadgeCount = document.getElementById('catalog-badge-count');
      const totalStorageText = document.getElementById('total-storage-text');
      const searchInput = document.getElementById('search-input');
      const btnReconnect = document.getElementById('btn-reconnect');
      const toastEl = document.getElementById('toast');

      const playerModal = document.getElementById('player-modal');
      const playerVideoTitle = document.getElementById('player-video-title');
      const playerElement = document.getElementById('player-element');
      const btnClosePlayer = document.getElementById('btn-close-player');

      function showToast(msg, duration = 3000) {
        toastEl.innerText = msg;
        toastEl.classList.remove('hidden');
        setTimeout(() => toastEl.classList.add('hidden'), duration);
      }

      function formatSize(bytes) {
        if (!bytes || bytes <= 0) return '0 MB';
        const mb = bytes / (1024 * 1024);
        if (mb >= 1024) return (mb / 1024).toFixed(1) + ' GB';
        return Math.round(mb) + ' MB';
      }

      // Abre o IndexedDB com fallback seguro
      function openDB(name) {
        return new Promise((resolve) => {
          try {
            const req = indexedDB.open(name);
            req.onsuccess = (e) => resolve(e.target.result);
            req.onerror = () => resolve(null);
            req.onblocked = () => resolve(null);
          } catch {
            resolve(null);
          }
        });
      }

      // Lê registros de uma store de forma otimizada para catálogos volumosos
      function getStoreData(db, storeName) {
        return new Promise((resolve) => {
          if (!db || !db.objectStoreNames.contains(storeName)) {
            resolve([]);
            return;
          }
          try {
            const tx = db.transaction(storeName, 'readonly');
            const store = tx.objectStore(storeName);

            // Para streams (catálogo volumoso), lê até 500 itens com cursor para evitar crash de IPC
            if (storeName === 'streams') {
              const list = [];
              const req = store.openCursor();
              req.onsuccess = (e) => {
                const cursor = e.target.result;
                if (cursor && list.length < 500) {
                  list.push(cursor.value);
                  cursor.continue();
                } else {
                  resolve(list);
                }
              };
              req.onerror = () => resolve([]);
              return;
            }

            const req = store.getAll();
            req.onsuccess = () => resolve(req.result || []);
            req.onerror = () => resolve([]);
          } catch {
            resolve([]);
          }
        });
      }

      // Carrega dados locais
      async function loadLocalData() {
        let db = await openDB(DB_NAME);
        if (!db || !db.objectStoreNames.contains('offline_downloads')) {
          db = await openDB(ALT_DB_NAME);
        }

        if (db) {
          allDownloads = await getStoreData(db, 'offline_downloads');
          allStreams = await getStoreData(db, 'streams');
        }

        renderUI();
      }

      // Agrupa downloads por Filme e Série
      function groupDownloads(list) {
        const map = new Map();
        for (const item of list) {
          const key = `${item.stream_type}_${item.stream_id}`;
          const mainTitle = item.series_title || (item.stream_type === 'series' ? item.title.split(' - ')[0] : item.title);

          if (!map.has(key)) {
            map.set(key, {
              key,
              stream_id: item.stream_id,
              stream_type: item.stream_type,
              title: mainTitle,
              poster_url: item.poster_url,
              total_size: item.file_size || 0,
              items_count: 1,
              episodes: [item],
            });
          } else {
            const g = map.get(key);
            g.total_size += item.file_size || 0;
            g.items_count += 1;
            g.episodes.push(item);
          }
        }

        // Ordena episódios
        for (const g of map.values()) {
          if (g.stream_type === 'series') {
            g.episodes.sort((a, b) => {
              const sDiff = (a.season_num || 0) - (b.season_num || 0);
              if (sDiff !== 0) return sDiff;
              return (a.episode_num || 0) - (b.episode_num || 0);
            });
          }
        }

        return Array.from(map.values());
      }

      // Renderiza a interface
      function renderUI() {
        const totalStorage = allDownloads.reduce((acc, d) => acc + (d.file_size || 0), 0);
        totalStorageText.innerText = formatSize(totalStorage);
        downloadsBadgeCount.innerText = String(allDownloads.length);
        catalogBadgeCount.innerText = String(allStreams.length);

        if (currentTab === 'downloads') {
          secDownloads.classList.remove('hidden');
          secCatalog.classList.add('hidden');
          renderDownloadsTab();
        } else {
          secDownloads.classList.add('hidden');
          secCatalog.classList.remove('hidden');
          renderCatalogTab();
        }
      }

      function renderDownloadsTab() {
        secDownloads.innerHTML = '';
        const groups = groupDownloads(allDownloads);

        const filtered = groups.filter((g) => {
          if (!searchQuery.trim()) return true;
          return g.title.toLowerCase().includes(searchQuery.toLowerCase());
        });

        if (filtered.length === 0) {
          secDownloads.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">🍿</div>
              <h3 style="font-size:16px; font-weight:800; color:#fff;">Nenhum vídeo baixado encontrado</h3>
              <p style="font-size:12px; color:#94a3b8; max-width:320px;">
                ${allDownloads.length === 0
                  ? 'Você ainda não salvou vídeos na memória. Conecte-se à internet para baixar filmes ou episódios.'
                  : 'Nenhum resultado corresponde à sua pesquisa.'}
              </p>
            </div>
          `;
          return;
        }

        filtered.forEach((group) => {
          const isExpanded = expandedKeys.has(group.key);
          const isSeries = group.stream_type === 'series';

          const card = document.createElement('div');
          card.className = 'group-card';

          const thumbSrc = group.poster_url || 'placeholder.svg';

          card.innerHTML = `
            <div class="group-header">
              <div class="group-left">
                <img class="group-thumb" src="${thumbSrc}" onerror="this.src='placeholder.svg'" />
                <div class="group-info">
                  <div class="group-badge-line">
                    <span class="badge-type">${isSeries ? 'Série' : 'Filme'}</span>
                    <span class="badge-size">${formatSize(group.total_size)}</span>
                  </div>
                  <h4 class="group-title" title="${group.title}">${group.title}</h4>
                  <p class="group-desc">
                    ${isSeries ? `${group.items_count} episódio(s) salvos na memória` : 'Filme completo pronto para assistir'}
                  </p>
                </div>
              </div>

              <div class="group-actions">
                ${!isSeries
                  ? `<button type="button" class="btn-action-primary btn-play-movie">▶ Assistir</button>`
                  : `<button type="button" class="btn-action-secondary btn-toggle-eps">
                      ${isExpanded ? '▲ Ocultar' : `▼ Episódios (${group.items_count})`}
                    </button>`
                }
                <button type="button" class="btn-action-danger btn-delete-group" title="Excluir da memória">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                  </svg>
                </button>
              </div>
            </div>

            ${isSeries && isExpanded ? `
              <div class="episodes-list">
                ${group.episodes.map((ep) => {
                  const epLabel = ep.season_num !== undefined && ep.episode_num !== undefined
                    ? `T${ep.season_num}:E${ep.episode_num} - ${ep.title.includes(' - ') ? ep.title.split(' - ').slice(1).join(' - ') : ep.title}`
                    : ep.title;

                  return `
                    <div class="episode-card" data-epid="${ep.id}">
                      <div class="episode-info">
                        <div class="episode-title" title="${epLabel}">${epLabel}</div>
                        <div class="episode-meta">${formatSize(ep.file_size)} • ${ep.container_extension || 'mp4'}</div>
                      </div>
                      <div class="episode-actions">
                        <button type="button" class="btn-action-primary btn-play-ep" data-epid="${ep.id}">▶</button>
                        <button type="button" class="btn-action-danger btn-delete-ep" data-epid="${ep.id}" title="Excluir episódio">✕</button>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            ` : ''}
          `;

          // Eventos
          if (!isSeries) {
            card.querySelector('.btn-play-movie').addEventListener('click', () => {
              playVideo(group.episodes[0]);
            });
          } else {
            card.querySelector('.btn-toggle-eps').addEventListener('click', () => {
              if (expandedKeys.has(group.key)) {
                expandedKeys.delete(group.key);
              } else {
                expandedKeys.add(group.key);
              }
              renderDownloadsTab();
            });

            // Ações nos episódios
            card.querySelectorAll('.btn-play-ep').forEach((btn) => {
              btn.addEventListener('click', (e) => {
                const epId = e.currentTarget.dataset.epid;
                const ep = group.episodes.find((x) => x.id === epId);
                if (ep) playVideo(ep);
              });
            });

            card.querySelectorAll('.btn-delete-ep').forEach((btn) => {
              btn.addEventListener('click', async (e) => {
                const epId = e.currentTarget.dataset.epid;
                const ep = group.episodes.find((x) => x.id === epId);
                if (!ep) return;
                if (!confirm(`Deseja excluir "${ep.title}" da memória do celular?`)) return;
                await deleteSingleDownload(ep.id, ep.file_path);
                showToast('Episódio excluído da memória');
                await loadLocalData();
              });
            });
          }

          card.querySelector('.btn-delete-group').addEventListener('click', async () => {
            const msg = isSeries
              ? `Deseja excluir todos os ${group.items_count} episódios de "${group.title}" da memória?`
              : `Deseja excluir "${group.title}" da memória?`;
            if (!confirm(msg)) return;

            for (const ep of group.episodes) {
              await deleteSingleDownload(ep.id, ep.file_path);
            }
            showToast('Título excluído da memória');
            await loadLocalData();
          });

          secDownloads.appendChild(card);
        });
      }

      function renderCatalogTab() {
        secCatalog.innerHTML = '';

        const filtered = allStreams.filter((s) => {
          if (!searchQuery.trim()) return true;
          const q = searchQuery.toLowerCase();
          return (s.title && s.title.toLowerCase().includes(q)) || (s.name && s.name.toLowerCase().includes(q));
        });

        if (filtered.length === 0) {
          secCatalog.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">📺</div>
              <h3 style="font-size:16px; font-weight:800; color:#fff;">Nenhum item em cache</h3>
              <p style="font-size:12px; color:#94a3b8; max-width:320px;">
                Conecte-se ao servidor online ao menos uma vez para sincronizar o catálogo completo na memória.
              </p>
            </div>
          `;
          return;
        }

        const grid = document.createElement('div');
        grid.style.cssText = 'display:grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px;';

        filtered.slice(0, 100).forEach((item) => {
          const itemKey = `${item.stream_type}_${item.stream_id}`;
          const isDownloaded = allDownloads.some((d) => String(d.stream_id) === String(item.stream_id));

          const itemEl = document.createElement('div');
          itemEl.style.cssText = 'background:#13141b; border:1px solid rgba(255,255,255,0.08); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; cursor:pointer;';

          itemEl.innerHTML = `
            <div style="position:relative; aspect-ratio:3/4; width:100%; background:#000;">
              <img src="${item.stream_icon || 'placeholder.svg'}" onerror="this.src='placeholder.svg'" style="width:100%; height:100%; object-fit:cover;" />
              ${isDownloaded ? `
                <div style="position:absolute; top:6px; right:6px; background:#10b981; color:#fff; border-radius:6px; padding:2px 5px; font-size:9px; font-weight:800;">
                  BAIXADO
                </div>
              ` : ''}
            </div>
            <div style="padding:8px;">
              <div style="font-size:11px; font-weight:700; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
                ${item.title || item.name}
              </div>
              <div style="font-size:10px; color:#94a3b8; margin-top:2px;">
                ${item.stream_type === 'series' ? 'Série' : item.stream_type === 'live' ? 'TV ao Vivo' : 'Filme'}
              </div>
            </div>
          `;

          itemEl.addEventListener('click', () => {
            if (isDownloaded) {
              const dl = allDownloads.find((d) => String(d.stream_id) === String(item.stream_id));
              if (dl) playVideo(dl);
            } else {
              alert(`"${item.title || item.name}" não está baixado na memória.\n\nConecte-se à internet para reproduzir ou baixar este título.`);
            }
          });

          grid.appendChild(itemEl);
        });

        secCatalog.appendChild(grid);
      }

      // Reprodução de Vídeo Offline
      function playVideo(item) {
        let src = item.file_path;
        if (window.Capacitor && window.Capacitor.convertFileSrc) {
          src = window.Capacitor.convertFileSrc(item.file_path);
        }

        playerVideoTitle.innerText = item.title;
        playerElement.src = src;
        playerModal.classList.remove('hidden');
        playerElement.play().catch(() => {});
      }

      btnClosePlayer.addEventListener('click', () => {
        playerElement.pause();
        playerElement.src = '';
        playerModal.classList.add('hidden');
      });

      // Exclusão de registro no IndexedDB
      async function deleteSingleDownload(id, filePath) {
        let db = await openDB(DB_NAME);
        if (!db || !db.objectStoreNames.contains('offline_downloads')) {
          db = await openDB(ALT_DB_NAME);
        }
        if (db) {
          try {
            const tx = db.transaction('offline_downloads', 'readwrite');
            tx.objectStore('offline_downloads').delete(id);
          } catch {}
        }

        // Tenta excluir via plugin Filesystem se nativo
        if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Filesystem) {
          try {
            const relativePath = filePath && filePath.includes('videos/')
              ? filePath.substring(filePath.indexOf('videos/'))
              : filePath;
            await window.Capacitor.Plugins.Filesystem.deleteFile({
              path: relativePath,
              directory: 'DATA',
            });
          } catch {}
        }
      }

      // Teste de conexão com o servidor
      async function testConnection(timeoutMs = 3000) {
        const ctrl = new AbortController();
        const tId = setTimeout(() => ctrl.abort(), timeoutMs);
        try {
          await fetch(`${SERVER_URL}/api/health`, { method: 'GET', signal: ctrl.signal });
          clearTimeout(tId);
          return true;
        } catch {
          clearTimeout(tId);
          return false;
        }
      }

      async function attemptReconnect() {
        btnReconnect.disabled = true;
        btnReconnect.querySelector('span').innerText = 'Verificando...';

        const ok = await testConnection();
        if (ok) {
          showToast('Servidor online! Conectando...', 2000);
          setTimeout(() => {
            window.location.replace(SERVER_URL);
          }, 400);
        } else {
          showToast('Servidor ainda inacessível. Você continua no Modo Offline.');
          btnReconnect.disabled = false;
          btnReconnect.querySelector('span').innerText = 'Reconectar';
        }
      }

      btnReconnect.addEventListener('click', attemptReconnect);

      // Se a conexão voltar no aparelho
      window.addEventListener('online', async () => {
        showToast('Conexão detectada! Testando servidor...');
        const ok = await testConnection();
        if (ok) {
          window.location.replace(SERVER_URL);
        }
      });

      // Abas
      tabDownloadsBtn.addEventListener('click', () => {
        currentTab = 'downloads';
        tabDownloadsBtn.classList.add('active');
        tabCatalogBtn.classList.remove('active');
        renderUI();
      });

      tabCatalogBtn.addEventListener('click', () => {
        currentTab = 'catalog';
        tabCatalogBtn.classList.add('active');
        tabDownloadsBtn.classList.remove('active');
        renderUI();
      });

      // Busca
      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value;
        renderUI();
      });

      // Gestos de Pull-to-refresh
      let touchStartY = 0;
      window.addEventListener('touchstart', (e) => {
        touchStartY = e.touches[0].clientY;
      }, { passive: true });

      window.addEventListener('touchend', async (e) => {
        const touchEndY = e.changedTouches[0].clientY;
        if (window.scrollY === 0 && touchEndY - touchStartY > 120) {
          showToast('Atualizando dados...');
          await loadLocalData();
          await attemptReconnect();
        }
      }, { passive: true });

      // Inicialização
      loadLocalData();
    })();
  </script>
</body>
</html>
